name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # No engines field and no .nvmrc. Next.js requires Node >=20.9.0; this repo runs on Node 22.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npx next build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility
        run: node scripts/a11y-axe.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit full tree
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          node scripts/audit-allowlist.mjs < "$RUNNER_TEMP/npm-audit.json"
